dependencies = [
    "boto3>=1.43.67",
    "chromadb>=1.5.9",
    "huggingface-hub>=1.27.0",
    "langchain>=1.3.14",
    "langchain-anthropic>=1.5.4",
    "langchain-aws>=1.7.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.4.3",
    "matplotlib>=3.11.1",
    "nltk>=3.10.2",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pypdf>=6.15.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "scikit-fuzzy>=0.5.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.61.1",
    "transformers>=5.15.0",
    "xgboost>=3.2.0",
]

[dependency-groups]
